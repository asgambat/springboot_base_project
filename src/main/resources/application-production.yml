spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH2_ISSUER_URI}

springdoc:
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,circuitbreakers
  endpoint:
    health:
      show-details: when_authorized

app:
  security:
    api-key: ${API_KEY}
    session-timeout-in-minutes: ${SESSION_TIMEOUT_IN_MINUTES:60}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS}
