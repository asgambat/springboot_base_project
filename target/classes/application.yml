spring:
  application:
    name: ms-base-prj
  devtools:
    restart:
      # DevTools: restart automatico al cambio del codice
      enabled: true
      poll-interval: 2s
      quiet-period: 1s
  cache:
    cache-names: products
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=5m

logging:
  level:
    io.micrometer.tracing: WARN
    org.springframework.boot.actuate.autoconfigure.tracing: WARN
    com.example.msbaseprj: DEBUG

server:
  port: 8080
  tomcat:
    threads:
      max: 200          # Maximum worker threads
      min-spare: 20     # Always keep 20 threads ready
    connection-timeout: 5000  # Reject connections that wait longer than 5s
    accept-count: 100   # Queue up to 100 requests before rejecting


management:
  server:
    port: 8081  # Separate port, not exposed to the internet
  prometheus:
    metrics:
      export:
        enabled: true  
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  endpoints:
    web:
      exposure:
        include: health, httpexchanges, metrics, prometheus, trace, circuitbreakers, threaddump
  metrics:
    enable:
      jvm: true   # Heap, non-heap, GC pause time — all automatic 
    tags:
      application: ${spring.application.name} # Tag all metrics with the app name
  endpoint:
    health:
      show-details: always
      show-components: always    
  health:
    livenessState:
      enabled: true #/actuator/health/liveness → JVM sanity (memory, threads, etc.)
    readinessState:
      enabled: true #/actuator/health/readiness → Dependency health (DB, Kafka, Redis, etc.)

resilience4j:
  circuitbreaker:
    instances:
      orderServiceCB:
        failureRateThreshold: 50 # Percentage of failures above which the circuit breaker should trip (50%)
        waitDurationInOpenState: 10s # Time the circuit breaker stays in the OPEN state before switching to HALF_OPEN (10 seconds)
        permittedNumberOfCallsInHalfOpenState: 3  # Number of permitted calls when the circuit is HALF_OPEN      
        slidingWindowType: COUNT_BASED # Strategy to record the outcome of calls (COUNT_BASED or TIME_BASED)
        slidingWindowSize: 10 # Number of latest calls to record (for COUNT_BASED) or time duration (for TIME_BASED)
        minimumNumberOfCalls: 5 # Minimum number of calls required to start calculating the failure rate
        automaticTransitionFromOpenToHalfOpenEnabled: true # Automatically transition from OPEN to HALF_OPEN after waitDurationInOpenState
        # Optional: specify which exceptions should be recorded as failures
        recordExceptions:
          - org.springframework.web.client.ResourceAccessException
          - java.io.IOException
          - java.util.concurrent.TimeoutException
        # Optional: specify which exceptions should *not* be recorded as failures (e.g., client errors)
        ignoreExceptions:
          - org.springframework.web.client.HttpClientErrorException$NotFound  
  
sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SPRING_PROFILES_ACTIVE:production}
  traces-sample-rate: 0.2
  enabled: ${SENTRY_ENABLED:false}

app:
  external-api:
    api:
      base-url: https://api.example.com
      enableLoggingInterceptor: true
      subscriptionKey: your-subscription-key-here
    retry:
      maxImmediateAttempts: 3
      maxBackoffMs: 2000 # in milliseconds
      baseBackoffMs: 300
      multiplier: 2.0
    connection:      
      responseTimeoutMillis: 10000
      connectionTimeoutMillis: 5000
      maxTotalConnections: 100
      maxConnectionsPerRoute: 50
      connectionTtlSeconds: 60
      connectionPoolMaxWaitTimeMillis: 5000
      evictionIdleTimeoutSeconds: 60

  security:
    apiKey: your-api-key-here
    sessionTimeoutInMinutes: 60